<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Truck Log Portal</title>
<style>
/* Company portal: read-only view of all drivers of one company. Desktop first, works on a phone. */
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#14202e; --muted:#5b6878; --line:#d5dbe3; --soft:#f5f7fa;
  --navy:#16324f; --navy-ink:#f4f7fb; --navy-muted:#a9bbd0;
  --accent:#e8a317; --accent-ink:#1b1300; --danger:#c0392b; --ok:#2e7d4f; --warnbg:#fff4d6; --badbg:#fde7e4; --infobg:#e6eef8;
  --display:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono","Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c141e; --panel:#142130; --ink:#e6edf5; --muted:#93a3b6; --line:#25364a; --soft:#101b28;
  --navy:#0a1622; --navy-ink:#eef4fb; --navy-muted:#8fa3ba;
  --accent:#f0b43a; --accent-ink:#1b1300; --danger:#ff6b5b; --ok:#5fcf8c; --warnbg:#3a2e10; --badbg:#3d1a17; --infobg:#16293f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c141e; --panel:#142130; --ink:#e6edf5; --muted:#93a3b6; --line:#25364a; --soft:#101b28;
  --navy:#0a1622; --navy-ink:#eef4fb; --navy-muted:#8fa3ba;
  --accent:#f0b43a; --accent-ink:#1b1300; --danger:#ff6b5b; --ok:#5fcf8c; --warnbg:#3a2e10; --badbg:#3d1a17; --infobg:#16293f; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:.02em;text-wrap:balance}
h2{font-size:20px;text-transform:uppercase}
h3{font-size:16px;text-transform:uppercase;color:var(--muted)}
a{color:inherit}
.bar{background:var(--navy);color:var(--navy-ink)}
.barin{max-width:1280px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
.brand{display:flex;flex-direction:column;border-left:3px solid var(--accent);padding-left:10px;line-height:1.15;margin-bottom:10px;min-width:0}
.brand span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--navy-muted)}
.brand b{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:.02em;overflow-wrap:anywhere}
.nav{display:flex;gap:2px;align-self:flex-end;flex:1;min-width:0;overflow-x:auto}
.nav button{font:inherit;font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:transparent;color:var(--navy-muted);border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap}
.nav button[aria-selected="true"]{color:var(--navy-ink);border-bottom-color:var(--accent)}
.barright{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--navy-muted)}
.barright select{width:auto;padding:6px 8px;font-size:14px;background:var(--navy);color:var(--navy-ink);border-color:#3b5673}
.wrap{max-width:1280px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;min-width:0}
input,select{font:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0;text-transform:none;letter-spacing:normal}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible,tr:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.navy{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.ghost{background:transparent;color:var(--navy-ink);border-color:#3b5673}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.6;cursor:default}
.err{color:var(--danger);font-weight:600;margin:0}
.note{margin:0;color:var(--muted);font-size:14px}
.demo{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px}
.login{max-width:380px;margin:8vh auto 0;width:100%}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.kpi span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-family:var(--mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi.att b{color:var(--danger)}
.kpi.att.zero b{color:var(--ok)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.alerts{display:flex;flex-direction:column;gap:6px}
.al{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 12px;border-radius:8px;background:var(--infobg);cursor:pointer;border:0;font:inherit;color:inherit;text-align:left;width:100%}
.al.bad{background:var(--badbg)}.al.warn{background:var(--warnbg)}
.al .dot{width:10px;height:10px;border-radius:50%;background:#4a78b5}
.al.bad .dot{background:var(--danger)}.al.warn .dot{background:var(--accent)}
.al b{font-weight:600}
.al small{color:var(--muted)}
.ok{color:var(--ok);font-weight:600}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.t{font-family:var(--mono);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
tr.total td{font-weight:700;background:var(--soft)}
tr.daysep td{background:var(--soft);padding:8px 10px}
tr.daysep .dname{font-family:var(--display);font-weight:600;font-size:16px}
tr.daysep .dsum{font-size:13px;color:var(--muted)}
td.empty{color:var(--muted);text-align:center;padding:24px}
.dn{font-weight:600;font-size:15px}
.dn small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;color:#fff;font-family:var(--display);font-weight:600;font-size:14px;white-space:nowrap;background:#3a4656}
.chip.light{color:#111}
.sub{display:block;font-size:12px;color:var(--muted);white-space:nowrap}
.stale{color:var(--danger)}
.mini{display:grid;grid-template-columns:auto 80px;gap:2px 8px;align-items:center;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mbar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.mbar i{display:block;height:100%;background:var(--ok)}
.mbar.near i{background:var(--accent)}.mbar.over i{background:var(--danger)}
.tl{position:relative;height:22px;min-width:180px;border:1px solid var(--line);border-radius:5px;overflow:hidden;background-color:var(--bg);background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100% / 24) 100%}
.tl .seg{position:absolute;top:0;bottom:0}
.tl .nowl{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.8}
.tlaxis{position:relative;height:14px;font:11px/14px var(--mono);color:var(--muted)}
.tlaxis span{position:absolute;transform:translateX(-50%)}
.tlaxis span:first-child{transform:none}.tlaxis span:last-child{transform:translateX(-100%)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.strip{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;padding:3px 0}
.strip .sl{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.strip .sl b{color:var(--ink);font-weight:600}
.period{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.period .field{width:150px}
.period .quick{display:flex;gap:6px;flex-wrap:wrap}
.spacer{flex:1}
.exports{display:flex;gap:6px;align-items:end;flex-wrap:wrap}
.exports select{width:auto}
.dhead{display:grid;grid-template-columns:1fr auto;gap:10px 20px;align-items:start}
.dtitle{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1}
.facts{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}
.lims{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px}
.lim{border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.lim span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lim b{font-family:var(--mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.lim .mbar{margin-top:5px}
.lim.over b{color:var(--danger)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{font:inherit;font-weight:600;background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px);z-index:5}
.toast.show{opacity:1}
.foot{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:space-between}
@media (max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}.lims{grid-template-columns:1fr 1fr}.dhead{grid-template-columns:1fr}}
@media (max-width:560px){.kpis{grid-template-columns:1fr 1fr}.kpi b{font-size:22px}.strip{grid-template-columns:1fr}.period .field{width:calc(50% - 4px)}.dtitle{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.bar,.period,.exports,.tabs,.btn{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<div class="bar"><div class="barin">
  <div class="brand"><span>Truck Log</span><b id="coName" data-i18n="p.title">Company portal</b></div>
  <nav class="nav" id="nav" hidden>
    <button type="button" data-view="overview" data-i18n="p.overview">Drivers</button>
    <button type="button" data-view="trips" data-i18n="p.trips">Trips &amp; orders</button>
    <button type="button" data-view="summary" data-i18n="p.summary">Summary</button>
  </nav>
  <div class="barright">
    <span id="who"></span>
    <select id="lang" aria-label="Language"></select>
    <button class="btn ghost small" id="btnLogout" type="button" data-i18n="p.logout" hidden>Sign out</button>
  </div>
</div></div>

<div class="wrap">
  <div class="demo" id="demoBar" hidden data-i18n="p.demo"></div>

  <section class="panel login" id="vLogin" hidden>
    <h2 data-i18n="p.signinT">Sign in</h2>
    <div class="field"><label for="lUser" data-i18n="p.user">User</label><input id="lUser" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
    <div class="field"><label for="lPass" data-i18n="p.pass">Password</label><input id="lPass" type="password" autocomplete="current-password"></div>
    <p class="err" id="lErr" hidden></p>
    <div><button class="btn primary" id="btnLogin" type="button" data-i18n="p.signin">Sign in</button></div>
    <p class="note" data-i18n="p.loginNote"></p>
  </section>

  <!-- period bar: lives inside the active view -->
  <div class="period" id="periodBar" hidden>
    <div class="field"><label for="from" data-i18n="p.from">From</label><input id="from" type="date"></div>
    <div class="field"><label for="to" data-i18n="p.to">To</label><input id="to" type="date"></div>
    <div class="quick">
      <button class="btn" type="button" data-range="week" data-i18n="p.week">7 days</button>
      <button class="btn" type="button" data-range="month" data-i18n="p.month">This month</button>
      <button class="btn" type="button" data-range="prev" data-i18n="p.prevMonth">Last month</button>
      <button class="btn" type="button" data-range="all" data-i18n="p.all">All</button>
    </div>
  </div>

  <!-- drivers overview -->
  <section id="vOverview" hidden style="display:flex;flex-direction:column;gap:16px">
    <div class="kpis">
      <div class="kpi"><span data-i18n="p.kDrivers">Drivers</span><b id="kDrivers">0</b></div>
      <div class="kpi"><span data-i18n="p.kDriving">Driving now</span><b id="kDriving">0</b></div>
      <div class="kpi"><span data-i18n="p.kWorking">Other work</span><b id="kWorking">0</b></div>
      <div class="kpi"><span data-i18n="p.kResting">Resting / off duty</span><b id="kResting">0</b></div>
      <div class="kpi att" id="kAttBox"><span data-i18n="p.kAttention">Need attention</span><b id="kAtt">0</b></div>
    </div>
    <div class="panel">
      <div class="head"><h2 data-i18n="p.attention">Needs attention</h2></div>
      <div class="alerts" id="alerts"></div>
    </div>
    <div class="panel">
      <div class="head"><h2 data-i18n="p.overview">Drivers</h2><div style="display:flex;gap:8px;align-items:center"><span class="note" id="updated"></span><button class="btn small" id="btnReload" type="button" data-i18n="p.reload">Refresh</button></div></div>
      <div class="tablebox"><table><thead id="ovHead"></thead><tbody id="ovRows"></tbody></table></div>
      <div class="legend" id="ovLegend"></div>
      <p class="note" data-i18n="p.liveNote"></p>
    </div>
    <div class="foot"><span id="seats"></span><span id="codeTxt"></span></div>
  </section>

  <!-- one driver -->
  <section id="vDriver" hidden style="display:flex;flex-direction:column;gap:16px">
    <div><button class="btn" id="btnBack" type="button" data-i18n="p.back">← All drivers</button></div>
    <div class="panel">
      <div class="dhead">
        <div style="min-width:0"><div class="dtitle" id="dName"></div><div class="facts" id="dFacts"></div></div>
        <div id="dNow" style="text-align:right"></div>
      </div>
      <div class="lims" id="dLims"></div>
      <p class="note" data-i18n="p.limNote"></p>
    </div>
    <div class="panel">
      <div class="head" style="align-items:end">
        <div class="pslot"></div>
        <div class="exports">
          <div class="field"><label for="repKind" data-i18n="p.report">Report</label><select id="repKind"><option value="days" data-i18n="p.byDays">By days</option><option value="totals" data-i18n="p.totals">Totals</option></select></div>
          <button class="btn primary" id="xlsBtn" type="button">Excel</button>
          <button class="btn primary" id="pdfBtn" type="button">PDF</button>
        </div>
      </div>
      <div class="tabs" id="dTabs">
        <button type="button" data-dt="days" data-i18n="p.days">Days</button>
        <button type="button" data-dt="log" data-i18n="p.log">Log</button>
        <button type="button" data-dt="trips" data-i18n="p.tripsTab">Trips</button>
        <button type="button" data-dt="fuel" data-i18n="p.fuel">Fuel</button>
      </div>
      <div id="dt-days" style="display:flex;flex-direction:column;gap:12px">
        <div class="kpis" style="grid-template-columns:repeat(4,1fr)">
          <div class="kpi"><span data-i18n="p.km">Km</span><b id="dKm">0</b></div>
          <div class="kpi"><span data-i18n="p.driving">Driving</span><b id="dDrive">0:00</b></div>
          <div class="kpi"><span data-i18n="p.work">Work time</span><b id="dWork">0:00</b></div>
          <div class="kpi"><span data-i18n="p.daysWorked">Days worked</span><b id="dDays">0</b></div>
        </div>
        <div class="tablebox"><table><thead id="sumHead"></thead><tbody id="sumRows"></tbody></table></div>
        <h3 data-i18n="p.dayStrips">Day by day</h3>
        <div id="strips"></div><div class="legend" id="stripLegend"></div>
      </div>
      <div id="dt-log" hidden style="display:flex;flex-direction:column;gap:10px">
        <input id="q" type="search" data-i18n-ph="p.search" placeholder="Search">
        <div class="tablebox" style="max-height:70vh;overflow:auto"><table><thead id="logHead"></thead><tbody id="logRows"></tbody></table></div>
        <span class="note" id="logCount"></span>
      </div>
      <div id="dt-trips" hidden><div class="tablebox"><table><thead id="dtHead"></thead><tbody id="dtRows"></tbody></table></div></div>
      <div id="dt-fuel" hidden style="display:flex;flex-direction:column;gap:10px"><div class="facts" id="fuelSum"></div><div class="tablebox"><table><thead id="fuelHead"></thead><tbody id="fuelRows"></tbody></table></div></div>
    </div>
  </section>

  <!-- trips and orders of all drivers -->
  <section id="vTrips" hidden style="display:flex;flex-direction:column;gap:16px">
    <div class="panel">
      <div class="head" style="align-items:end"><div class="pslot"></div><div class="field" style="width:280px;max-width:100%"><label for="tq" data-i18n="p.find">Find</label><input id="tq" type="search" data-i18n-ph="p.searchTrips" placeholder=""></div></div>
      <h2 data-i18n="p.tripsTab">Trips</h2>
      <div class="tablebox"><table><thead id="trHead"></thead><tbody id="trRows"></tbody></table></div>
      <h2 data-i18n="p.ordersList">Orders</h2>
      <div class="tablebox"><table><thead id="orHead"></thead><tbody id="orRows"></tbody></table></div>
    </div>
  </section>

  <!-- totals per driver -->
  <section id="vSummary" hidden style="display:flex;flex-direction:column;gap:16px">
    <div class="panel">
      <div class="head" style="align-items:end"><div class="pslot"></div>
        <div class="exports"><button class="btn primary" id="allXls" type="button" data-i18n="p.exportAll">Excel – all drivers</button><button class="btn primary" id="allPdf" type="button" data-i18n="p.pdfAll">PDF – all drivers</button></div></div>
      <div class="tablebox"><table><thead id="smHead"></thead><tbody id="smRows"></tbody></table></div>
      <p class="note" data-i18n="p.sumNote"></p>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
const ACTS=[
  {k:'Driving',ic:'drive'},{k:'Loading',ic:'load',order:true},{k:'Unload',ic:'unload',order:true},
  {k:'Coupling',ic:'couple',trailer:true},{k:'Uncoupling',ic:'uncouple',trailer:true},{k:'Register',ic:'reg'},
  {k:'Wait',ic:'wait'},{k:'Break',ic:'brk'},{k:'Sleep',ic:'sleep'},
  {k:'Fuel',ic:'fuel'},{k:'Truckwash',ic:'wash'},{k:'Maintenance',ic:'maint'},
  {k:'Traffic jam',ic:'jam',full:true},
  {k:'Other',ic:'other',full:true,other:true},
  {k:'Break down',ic:'down',full:true,warn:true}
];
const DAYT=['Start day','End day'];
const ORDER=[...ACTS.map(a=>a.k),'Unknown'];
const ALLTYPES=[...DAYT,...ORDER,'Border'];
const REST=new Set(['Break','Sleep']);
const workMs=acts=>Object.keys(acts).reduce((s,a)=>REST.has(a)?s:s+(acts[a]||0),0);
const dispType=e=>e.type==='Other'&&e.other?e.other:tA(e.type);
function fillOtherList(){const dl=$('otherList');if(!dl)return;const seen=new Map();sorted().reverse().forEach(e=>{if(e.type==='Other'&&e.other&&!seen.has(e.other.toLowerCase()))seen.set(e.other.toLowerCase(),e.other)});dl.innerHTML='';[...seen.values()].slice(0,15).forEach(v=>{const o=document.createElement('option');o.value=v;dl.appendChild(o)})}
const isTrailerType=t=>t==='Coupling'||t==='Uncoupling';
const DEFAULT_CO='Mark Huisman Solutions';
const co=()=>(settings.company||'').trim();

const LEGAL={"en": {"privacy": [["Who we are", ["Truck Log is an app for truck drivers to keep a log of their working day. This policy explains what happens with the information you enter. The developer’s contact details are shown on the app’s Google Play page."]], ["What the app stores", ["The activities you log (type, start time, duration), odometer readings, trip and order numbers, trailer and truck numbers, fuel litres, border crossings (country), your name, notes and the location (place name and GPS coordinates) of each activity.", "Your settings, such as language and appearance."]], ["Where it is stored", ["Everything you log is stored on your phone. The app has no advertising and no analytics, and we do not sell your data.", "If the app is activated with a company code, a copy is also sent to your company (see “Sharing with your company”).", "Once a day the app saves a backup file in Documents/TruckLog on your phone, keeping the last 7 days."]], ["Sharing with your company", ["If you activated the app with a company code, the app sends your log to our server so that your company can see it: activities with their times, locations and GPS coordinates, odometer readings, trips, order, trailer and truck numbers, fuel, border crossings, notes and your name. Changes and deletions you make are sent too.", "Only people your company has given a login to can see this data, and only for drivers using that company’s code. Your company decides how it uses the data and is responsible for informing you about it.", "Sending happens automatically when the phone has internet. The app tells you once before it starts. With the 7-day trial code nothing is sent.", "The data stays on the server for as long as the company uses the service. To have it deleted, ask your company or contact us."]], ["Location", ["The app reads your location when you log an activity, so the place is saved with it.", "If you turn on Automatic driving, the app also reads your location in the background to detect the truck’s speed. A notification is shown while this is running. You can turn it off at any time in Settings."]], ["Sharing", ["Apart from the company sharing described above, data leaves your phone only when you choose to export a report or a backup and send it, for example by WhatsApp or e-mail. What happens to it then depends on the app or person you send it to."]], ["Permissions", ["Location: to save where each activity happened and, if you turn it on, for Automatic driving.", "Notifications: for the stop alert and the break reminder.", "Files: to save reports and backups on your phone."]], ["Deleting your data", ["Settings → Delete all data removes everything from the app. Uninstalling the app also removes it. Backup and report files you saved stay on the phone until you delete them."]], ["Activation", ["When you enter an activation code, the app sends the code, an identifier of this phone and the phone model to our activation server. The server keeps them to know how many phones use each code. Now and then the app checks with the server that the code is still valid."]], ["Children", ["The app is meant for adult professional drivers and is not directed at children."]], ["Changes", ["If this policy changes, the new version will be shown in the app with a new date."]]], "terms": [["Use of the app", ["Truck Log helps you keep your own record of working time. You are responsible for entering correct information and for checking it."]], ["Not an official record", ["The driving time guide, the totals and the reports are for information only. They do not replace the tachograph, your employer’s records or any legal obligation. Always follow the official tachograph and the rules that apply to you."]], ["Automatic driving", ["Automatic driving depends on the phone’s GPS. It can be late or miss changes, for example in tunnels, with weak signal or when the phone closes the app to save battery. Check your log and correct it when needed."]], ["Your data", ["Your data stays on your phone. You are responsible for keeping backups. We cannot recover lost data."]], ["No warranty", ["The app is provided “as is”, without any warranty. To the extent the law allows, the developer is not liable for any loss, fine or damage resulting from using the app."]], ["Purchases and refunds", ["If you bought the app on Google Play, Google Play’s refund rules apply."]], ["Changes", ["These terms may be updated with new versions of the app."]]]}, "ro": {"privacy": [["Cine suntem", ["Truck Log este o aplicație pentru șoferii de camion, care le ține evidența zilei de lucru. Această politică explică ce se întâmplă cu informațiile pe care le introduci. Datele de contact ale dezvoltatorului sunt pe pagina aplicației din Google Play."]], ["Ce salvează aplicația", ["Activitățile notate (tipul, ora de început, durata), kilometrajul, numerele de cursă și de ordin, numerele remorcii și camionului, litrii alimentați, trecerile de frontieră (țara), numele tău, notele și locația fiecărei activități (numele locului și coordonatele GPS).", "Setările tale, de exemplu limba și aspectul."]], ["Unde se salvează", ["Tot ce notezi se salvează pe telefonul tău. Aplicația nu are reclame sau statistici de utilizare, iar noi nu vindem datele tale.", "Dacă aplicația e activată cu codul unei firme, o copie se trimite și firmei tale (vezi „Trimiterea către firma ta”).", "O dată pe zi, aplicația salvează un fișier de backup în Documents/TruckLog pe telefon și păstrează ultimele 7 zile."]], ["Trimiterea către firma ta", ["Dacă ai activat aplicația cu codul unei firme, aplicația trimite jurnalul tău pe serverul nostru, ca firma ta să-l poată vedea: activitățile cu orele lor, locațiile și coordonatele GPS, kilometrajul, cursele, numerele de ordin, de remorcă și de camion, alimentările, trecerile de frontieră, notele și numele tău. Se trimit și modificările și ștergerile pe care le faci.", "Datele le pot vedea doar persoanele cărora firma ta le-a dat un cont, și doar pentru șoferii care folosesc codul acelei firme. Firma ta hotărăște cum folosește datele și răspunde de informarea ta.", "Trimiterea se face automat când telefonul are internet. Aplicația te anunță o dată înainte să înceapă. Cu codul de probă de 7 zile nu se trimite nimic.", "Datele rămân pe server cât timp firma folosește serviciul. Ca să fie șterse, cere firmei tale sau contactează-ne."]], ["Locația", ["Aplicația citește locația când notezi o activitate, ca să salveze locul împreună cu ea.", "Dacă pornești Condus automat, aplicația citește locația și în fundal, ca să afle viteza camionului. Cât timp funcționează, se vede o notificare. Poți opri funcția oricând din Setări."]], ["Trimiterea datelor", ["În afară de trimiterea către firmă descrisă mai sus, datele ies de pe telefon doar când alegi tu să exporți un raport sau un backup și să-l trimiți, de exemplu pe WhatsApp sau pe email. Ce se întâmplă apoi cu ele depinde de aplicația sau persoana căreia le trimiți."]], ["Permisiuni", ["Locație: ca să salveze unde a avut loc fiecare activitate și, dacă o pornești, pentru Condus automat.", "Notificări: pentru alerta de oprire și avertismentul de pauză.", "Fișiere: ca să salveze rapoarte și backupuri pe telefon."]], ["Ștergerea datelor", ["Setări → Șterge toate datele șterge tot din aplicație. Și dezinstalarea aplicației le șterge. Fișierele de backup și rapoartele salvate rămân pe telefon până le ștergi tu."]], ["Activare", ["Când introduci un cod de activare, aplicația trimite serverului nostru de activare codul, un identificator al acestui telefon și modelul telefonului. Serverul le păstrează ca să știe câte telefoane folosesc fiecare cod. Din când în când aplicația verifică la server dacă codul mai este valabil."]], ["Copii", ["Aplicația este pentru șoferi profesioniști adulți și nu se adresează copiilor."]], ["Modificări", ["Dacă politica se schimbă, noua variantă apare în aplicație cu o dată nouă."]]], "terms": [["Folosirea aplicației", ["Truck Log te ajută să ții propria evidență a timpului de lucru. Tu răspunzi de corectitudinea datelor introduse și de verificarea lor."]], ["Nu este o evidență oficială", ["Ghidul timpului de condus, totalurile și rapoartele sunt doar informative. Nu înlocuiesc tahograful, evidența angajatorului sau vreo obligație legală. Urmează întotdeauna tahograful oficial și regulile care ți se aplică."]], ["Condus automat", ["Condusul automat depinde de GPS-ul telefonului. Poate întârzia sau rata schimbări, de exemplu în tuneluri, cu semnal slab sau când telefonul închide aplicația ca să economisească bateria. Verifică registrul și corectează-l când e nevoie."]], ["Datele tale", ["Datele rămân pe telefonul tău. Tu răspunzi de păstrarea backupurilor. Nu putem recupera date pierdute."]], ["Fără garanție", ["Aplicația este oferită „așa cum este”, fără nicio garanție. În limitele permise de lege, dezvoltatorul nu răspunde pentru pierderi, amenzi sau daune rezultate din folosirea aplicației."]], ["Cumpărare și rambursare", ["Dacă ai cumpărat aplicația din Google Play, se aplică regulile de rambursare Google Play."]], ["Modificări", ["Acești termeni pot fi actualizați odată cu versiunile noi ale aplicației."]]]}};

    if(DAYT.includes(e.type)){if(e.ts>=a&&e.ts<=b)rows.push({e,from:e.ts,to:null});continue}
    const from=Math.max(e.ts,a),to=Math.min(end,b);if(to<=from)continue;
    acts[e.type]=(acts[e.type]||0)+(to-from);
    if(e.type==='Other'){const n=e.other||'Other';others[n]=(others[n]||0)+(to-from)}
    if(e.order&&e.ts>=a)orders.push({e,from});
    rows.push({e,from,to,ongoing:!s[i+1]&&!tr.end})}
  const borders=sortedAll().filter(e=>MARK.has(e.type)&&e.ts>=a&&e.ts<=b);borders.forEach(e=>rows.push({e,from:e.ts,to:null}));rows.sort((x,y)=>x.from-y.from);
  const km=(tr.startKm!=null&&tr.endKm!=null)?Math.max(0,tr.endKm-tr.startKm):null;
  return {a,b,acts,others,orders,rows,km,borders};
}

async function ensureFrom(fromKey){

}

function driverStatus(d){
  const s=sorted(),cur=s.at(-1)||null,now=Date.now(),age=realNow()-(Date.parse(d.synced_at)||0);
  const C=compute(),today=C.days[todayKey()]||null,L0=limits(),od=openDay(),ot=openTrip();

  let group='none';if(cur&&age<6*H){group=cur.type==='Driving'?'driving':(cur.type==='Break'||cur.type==='Sleep'||cur.type==='End day')?'rest':'work'}
  const fresh=age<45*60e3;const al=[];
  const A=(sev,text)=>al.push({sev,text,d});
  if(cur&&cur.type==='Break down')A('bad',t('p.aBreakdown',{t:fmtT(new Date(cur.ts))})+(cur.loc?' · '+cur.loc:''));
  if(cur&&cur.type==='Driving'&&fresh){if(L0.cont>=LIM.cont)A('bad',t('p.aCont',{t:hm(L0.cont)}));else if(L0.cont>=LIM.cont-15*60e3)A('warn',t('p.aContNear',{t:hm(L0.cont)}))}
  if(fresh||group!=='driving'){
    if(L0.day>dayMax)A('bad',t('p.aDay',{t:hm(L0.day),m:hm(dayMax)}));
    if(L0.week>LIM.week)A('bad',t('p.aWeek',{t:hm(L0.week)}));
    if(L0.fort>LIM.fort)A('bad',t('p.aFort',{t:hm(L0.fort)}));
  }
  if(L0.weeklyDue!=null&&now>L0.weeklyDue&&group!=='rest')A('warn',t('p.aWeekly',{d:fmtT(new Date(L0.weeklyDue))}));
  if(od&&now-od.ts>15*H&&fresh)A('warn',t('p.aLongDay',{t:fmtDur(now-od.ts)}));
  if(od&&age>12*H)A('warn',t('p.aStale',{t:fmtSpan(age)}));
  const unk=s.filter(e=>e.type==='Unknown'&&e.ts>now-3*864e5).length;if(unk)A('info',t('p.aUnknown',{n:unk}));
  return {cur,group,age,fresh,today,L0,dayMax,od,ot,al,trailer:currentTrailer(),C};
}

function tripCells(tr,D){return [fmtT(new Date(tr.start)),tr.end?fmtT(new Date(tr.end)):t('p.ongoing'),fmtDur(Math.max(0,D.b-D.a)),hm(workMs(D.acts)),hm(D.acts['Driving']||0),D.km!=null?fmtKm(D.km):'',[...new Set(D.orders.map(o=>o.e.order))].join(', ')]}

function doExport(R,kind,suffix){

/* ----- trips and orders of all drivers ----- */

  const q=$('tq').value.trim().toLowerCase();
  head('trHead',[{t:t('p.driver')},{t:t('p.tripNo')},{t:t('p.start')},{t:t('p.end')},{t:t('p.duration'),n:1},{t:t('p.work'),n:1},{t:t('p.driving'),n:1},{t:t('p.km'),n:1},{t:t('p.orders')},{t:''}]);

    tripsInPeriod().forEach(tr0=>{const D=tripData(tr0);const c=tripCells(tr0,D);const hay=[dname(d),d.truck,tr0.no,c[6]].join(' ').toLowerCase();if(!q||hay.includes(q))rows.push({d,tr0,c})});
    sorted().filter(e=>e.order&&inRangeKey(isoDay(new Date(e.ts)))).forEach(e=>{const hay=[dname(d),e.order,e.trip,e.loc,tA(e.type)].join(' ').toLowerCase();if(!q||hay.includes(q))ords.push({d,e})})});

    c.forEach((x,i)=>tr.appendChild(el('td',i<2?'t':(i<6?'n':null),x)));const td=el('td');td.style.whiteSpace='nowrap';exportBtns(td,()=>{useDriver(d);return reportTrip(tr0)},fileSafe(d.name));tr.appendChild(td);tb.appendChild(tr)});
  const ob=$('orRows');ob.innerHTML='';if(!ords.length)emptyRow(ob,7,t('p.noData'));

$('tq').oninput=()=>{if(view==='trips')renderTrips()};

/* ----- summary of all drivers ----- */
function summaryRows(){
  return drivers.map(d=>{useDriver(d);const C=compute();const T=totalsOf(C);const F=fuelPeriod();const list=sortedAll().filter(inPeriod);
    return {d,T,trips:tripsInPeriod().length,borders:list.filter(e=>e.type==='Border').length,litres:F.litres,avg:F.avg,fuelOk:F.list.filter(x=>x.l100!=null),has:list.length>0||T.keys.length>0}}).filter(r=>r.has);
}
function renderSummary(){
  head('smHead',[{t:t('p.driver')},{t:t('p.truck')},{t:t('p.daysWorked'),n:1},{t:t('p.km'),n:1},{t:t('p.work'),n:1},{t:t('p.driving'),n:1},{t:t('p.breakSleep'),n:1},{t:t('p.tripsTab'),n:1},{t:t('p.borders'),n:1},{t:t('p.fuelL'),n:1},{t:t('p.avg'),n:1}]);
  const tb=$('smRows');tb.innerHTML='';const R=summaryRows();
  if(!R.length){emptyRow(tb,11,t('p.noData'));return}
  const cells=r=>[dname(r.d),r.d.truck||'',r.T.days,fmtKm(r.T.km)||'0',hm(r.T.work),hm(r.T.drive),hm(r.T.rest),r.trips,r.borders,fmtL(r.litres),r.avg!=null?fmtL(r.avg):''];
  R.forEach(r=>{const tr=el('tr','click');tr.onclick=()=>openDriver(r.d.id);cells(r).forEach((c,i)=>tr.appendChild(el('td',i>=2?'n':null,String(c))));tr.firstChild.style.fontWeight='600';tb.appendChild(tr)});
  const S=sumTotals(R);const tr=el('tr','total');[t('p.total'),'',S.days,fmtKm(S.km)||'0',hm(S.work),hm(S.drive),hm(S.rest),S.trips,S.borders,fmtL(S.litres),S.avg!=null?fmtL(S.avg):''].forEach((c,i)=>tr.appendChild(el('td',i>=2?'n':null,String(c))));tb.appendChild(tr);
}
function sumTotals(R){const S={days:0,km:0,work:0,drive:0,rest:0,trips:0,borders:0,litres:0,avg:null};let fl=0,fd=0;
  R.forEach(r=>{S.days+=r.T.days;S.km+=r.T.km;S.work+=r.T.work;S.drive+=r.T.drive;S.rest+=r.T.rest;S.trips+=r.trips;S.borders+=r.borders;S.litres+=r.litres;r.fuelOk.forEach(x=>{fl+=x.e.litres;fd+=x.dist})});
  if(fd>0)S.avg=fl/fd*100;return S}
/* files for all drivers (English, like every report) */
function allData(){
  const R=summaryRows();if(!R.length)return null;const S=sumTotals(R);const r1=x=>Math.round(x*10)/10;
  const head0=['Driver','Truck','Days worked','Km driven','Work time (excl. break & sleep)','Driving','Break + sleep','Trips','Border crossings','Fuel (litres)','l/100 km'];
  const rows=R.map(r=>[r.d.name||'',r.d.truck||'',r.T.days,r.T.km,hm(r.T.work),hm(r.T.drive),hm(r.T.rest),r.trips,r.borders,r1(r.litres),r.avg!=null?r1(r.avg):'']);
  rows.push(['TOTAL','',S.days,S.km,hm(S.work),hm(S.drive),hm(S.rest),S.trips,S.borders,r1(S.litres),S.avg!=null?r1(S.avg):'']);
  const info=[['Company',me?me.company:''],['Period',periodLabel()],['Drivers',R.length],['Generated',fmtT(new Date())]];
  const per=R.map(r=>{useDriver(r.d);return {d:r.d,days:reportDays(),totals:reportTotals()}});asOf=null;
  return {head0,rows,info,per};
}
function sheetName(wb,base){let n=noDia(base).replace(/[\[\]\*\?\/\\:]/g,' ').trim().slice(0,31)||'Sheet';let i=2;while(wb.SheetNames.includes(n)){const suf=' '+i++;n=n.slice(0,31-suf.length)+suf}return n}
$('allXls').onclick=()=>{
  if(!window.XLSX)return toast(t('p.libMissing'));const A=allData();if(!A)return toast(t('p.nothing'));

};
$('allPdf').onclick=()=>{
  if(!window.jspdf)return toast(t('p.libMissing'));const A=allData();if(!A)return toast(t('p.nothing'));
  const doc=new jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});const Cn=r=>r.map(x=>noDia(x));

    doc.autoTable({startY:y+2,head:[Cn(tb.head)],body:tb.rows.map(Cn),styles:{fontSize:tb.small?7.5:8.5,cellPadding:tb.small?1.4:1.7},headStyles:{fillColor:[22,50,79]},alternateRowStyles:{fillColor:[240,243,247]},

/* ----- views ----- */
let view='overview';
const VIEWS={overview:'vOverview',driver:'vDriver',trips:'vTrips',summary:'vSummary'};
function showView(v){view=VIEWS[v]?v:'overview';
  Object.keys(VIEWS).forEach(k=>{$(VIEWS[k]).hidden=k!==view});
  document.querySelectorAll('#nav [data-view]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===view||(view==='driver'&&b.dataset.view==='overview'))));
  const slot=document.querySelector(`#${VIEWS[view]} .pslot`),pb=$('periodBar');pb.hidden=!slot;if(slot&&pb.parentNode!==slot)slot.appendChild(pb);
  window.scrollTo(0,0);render()}
function render(){if(!me)return;try{if(view==='overview')renderOverview();else if(view==='driver')renderDriver();else if(view==='trips')renderTrips();else renderSummary()}finally{asOf=null}}
document.querySelectorAll('#nav [data-view]').forEach(b=>b.onclick=()=>showView(b.dataset.view));
function showShell(){
  const inn=!!(sess&&me);$('vLogin').hidden=inn;$('nav').hidden=!inn;$('btnLogout').hidden=!inn;
  $('coName').textContent=inn?me.company:t('p.title');$('who').textContent=inn?me.username:'';
  if(!inn){Object.values(VIEWS).forEach(id=>{$(id).hidden=true});$('periodBar').hidden=true;$('vLogin').hidden=false}
}
async function boot(){
  const r=await api('/rest/v1/rpc/tlm_me',{method:'POST',body:'{}'});
  if(!r||!r.ok){const er=r&&r.error==='inactive'?t('p.inactive'):t('p.noAccess');sess=null;pls.del('tlp-sess');showShell();throw new Error(er)}
  me=r;setRange('month');showShell();
  await poll(true);await ensureFrom(addDays($('from').value,-35));
  showView('overview');
  clearInterval(pollH);pollH=setInterval(async()=>{if(document.hidden||!me)return;try{await poll(false);if(view!=='driver'||dtab!=='log'||!$('q').value)render()}catch(e){}},60000);
}
$('btnLogin').onclick=signIn;$('lPass').addEventListener('keydown',e=>{if(e.key==='Enter')signIn()});
$('btnLogout').onclick=signOut;
$('btnReload').onclick=async()=>{$('btnReload').disabled=true;try{await poll(true);await ensureFrom($('from').value?addDays($('from').value,-35):'');render()}catch(e){toast(e.message)}$('btnReload').disabled=false};

/* ----- language ----- */
function setLang(l){lang=LOCALE[l]?l:'en';$('lang').value=lang;pls.set('tlp-lang',lang);applyLang();showShell();if(me)render()}
LANGS.forEach(([code,name])=>{const o=document.createElement('option');o.value=code;o.textContent=name;$('lang').appendChild(o)});
$('lang').onchange=()=>setLang($('lang').value);



(async()=>{
  const n=(navigator.language||'en').slice(0,2).toLowerCase();setLang(pls.get('tlp-lang','')||(LOCALE[n]?n:'en'));
  if(DEMO){$('demoBar').hidden=false;sess={at:'demo'}}
  showShell();
  if(sess){try{await boot()}catch(e){if(!DEMO){$('lErr').textContent=e.message;$('lErr').hidden=false}}}
})();
